version: "3.8"

# ==============================================================================
# ORQUESTACIÓN COMPLETA CON DOCKER COMPOSE - RESTAURANTE "TRADICIÓN Y SABOR"
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: Servidor web privado (React/Vite)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: https://github.com/nelrondon/Tradiciones-y-Sabores.git#main
      dockerfile: Dockerfile
    container_name: frontend_restaurante
    restart: always
    ports:
      - "8080:80" # Puerto 8080 expuesto para acceso directo al frontend
    depends_on:
      - backend
      - n8n
    networks:
      - red-restaurante

  # ----------------------------------------------------------------------------
  # 1.5. NGINX PROXY MANAGER (NPM): Interfaz de Administración Web y Proxy Público
  # ----------------------------------------------------------------------------
  npm:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: npm_restaurante
    restart: unless-stopped
    ports:
      - "80:80" # Tráfico HTTP
      - "81:81" # Interfaz web de administración NPM
      - "443:443" # Tráfico HTTPS
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
    networks:
      - red-restaurante

  # ----------------------------------------------------------------------------
  # 2. BASE DE DATOS: PostgreSQL 15
  # ----------------------------------------------------------------------------
  db_restaurante:
    image: postgres:15-alpine
    container_name: db_restaurante
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_tradicion_sabor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_contrasena_segura_123!}
      POSTGRES_DB: ${POSTGRES_DB:-tradicion_y_sabor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montamos la carpeta local 'sql' para inicializar las tablas
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-restaurante

  # ----------------------------------------------------------------------------
  # 3. BACKEND: API REST Node.js
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_restaurante
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      API_KEY: ${API_KEY:-tu_clave_api_secreta}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-admin_tradicion_sabor}:${POSTGRES_PASSWORD:-cambia_esta_contrasena_segura_123!}@db_restaurante:5432/${POSTGRES_DB:-tradicion_y_sabor_db}}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://${POSTGRES_USER:-admin_tradicion_sabor}:${POSTGRES_PASSWORD:-cambia_esta_contrasena_segura_123!}@db_restaurante:5432/${POSTGRES_DB:-tradicion_y_sabor_db}}
    depends_on:
      db_restaurante:
        condition: service_healthy
    networks:
      - red-restaurante

  # ----------------------------------------------------------------------------
  # 4. AUTOMATIZACIÓN n8n
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_restaurante
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://localhost/webhook/}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - red-restaurante

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local

networks:
  red-restaurante:
    driver: bridge
    name: red-restaurante
